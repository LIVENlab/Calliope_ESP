        unit: power
      wind_tech_limit_esp_5:
        title: ''
        description: ''
        active: true
        default: .nan
        resample_method: first
        unit: power
      wind_tech_limit_esp_6:
        title: ''
        description: ''
        active: true
        default: .nan
        resample_method: first
        unit: power
      wind_tech_limit_esp_7:
        title: ''
        description: ''
        active: true
        default: .nan
        resample_method: first
        unit: power
      wind_tech_limit_esp_8:
        title: ''
        description: ''
        active: true
        default: .nan
        resample_method: first
        unit: power
      wind_tech_limit_esp_9:
        title: ''
